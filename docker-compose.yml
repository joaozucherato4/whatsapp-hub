
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: whzap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: whzap
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/src/migrations.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [internal]

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: always
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://whzap:${POSTGRES_PASSWORD}@postgres:5432/whzap?schema=evolution"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: "BotyZap"
      WEBHOOK_GLOBAL_URL: "http://backend:4000/webhooks/evolution"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
    volumes:
      - evolution_data:/evolution/instances
    networks: [internal]

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgres://whzap:${POSTGRES_PASSWORD}@postgres:5432/whzap
      EVOLUTION_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      HOTMART_WEBHOOK_TOKEN: ${HOTMART_WEBHOOK_TOKEN}
      KIWIFY_WEBHOOK_TOKEN: ${KIWIFY_WEBHOOK_TOKEN}
    depends_on: [postgres, evolution-api]
    networks: [internal]

  frontend:
    build: ./frontend
    restart: always
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks: [internal]
    depends_on: [frontend, backend]

networks:
  internal:

volumes:
  pg_data:
  evolution_data:
  caddy_data:
